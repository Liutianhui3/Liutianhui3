name: Update profile statistics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - scripts/update_profile_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate statistics cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_profile_stats.py
      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/stats/*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update profile statistics'
            git push
          fi
